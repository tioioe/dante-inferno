<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio audio — Inferno</title>
<link rel="stylesheet" href="hud.css">
<style>
  html,body{height:auto;overflow:auto;background:radial-gradient(ellipse at 50% -10%,#2a0f0a,#0a0405 60%);color:#e8d2b0;min-height:100%}
  body{margin:0;padding:34px 22px 60px;user-select:none}
  .wrap{max-width:1020px;margin:0 auto}
  h1{font:700 40px var(--f-title);letter-spacing:.14em;text-align:center;margin:0;color:#f6dca6;text-shadow:0 0 28px #b04010,0 3px 4px #000}
  .sub{text-align:center;font:italic 20px var(--f-body);color:#d8b080;margin:6px 0 20px}
  .bar{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 18px;padding:12px 16px;background:#00000050;box-shadow:inset 0 0 0 1px #3a2a1a}
  .bar label{font:600 12px var(--f-label);letter-spacing:.2em;color:#a88a5a;display:flex;align-items:center;gap:10px}
  input[type=range]{accent-color:#d88a30;width:150px}
  canvas{display:block;width:100%;height:120px;background:#080303;box-shadow:inset 0 0 0 1px #5a4020,inset 0 0 24px #000;margin-bottom:6px}
  .lvl{height:6px;background:#1a0d08;margin-bottom:22px;box-shadow:0 0 0 1px #5a4020}.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e08a30,#ffd070)}
  h2{font:700 15px var(--f-label);letter-spacing:.34em;color:#b89a68;margin:26px 0 10px;display:flex;align-items:center;gap:14px}
  h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#8a6a3a,transparent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
  button{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;background:linear-gradient(#1c1210,#0e0807);box-shadow:inset 0 0 0 1px #5a4020,0 2px 8px #000;transition:all .12s}
  button:hover{box-shadow:inset 0 0 0 1px #ffd890,0 0 16px #ff7a2a66;transform:translateY(-2px)}
  button:active{transform:scale(.97)}
  button b{display:block;font:700 15px var(--f-label);letter-spacing:.05em;color:#f6dca6}
  button span{display:block;font:italic 15px/1.3 var(--f-body);color:#bfa27c;margin-top:3px}
  button.on{background:linear-gradient(#4a1c0a,#2a0e06);box-shadow:inset 0 0 0 1px #ffb060,0 0 18px #ff7a2a88}
  .hint{text-align:center;font:italic 16px var(--f-body);color:#8a7050;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>LABORATORIO AUDIO</h1>
  <div class="sub">Ogni suono del gioco, sintetizzato dal vivo: nessun file audio</div>
  <canvas id="scope" width="1000" height="120"></canvas>
  <div class="lvl"><i id="meter"></i></div>
  <div class="bar">
    <label>VOLUME <input id="vol" type="range" min="0" max="100" value="85"></label>
    <button id="amb" style="padding:8px 18px"><b>Ambiente: spento</b></button>
    <button id="int" style="padding:8px 18px"><b>Tensione: 0%</b></button>
    <button id="mute" style="padding:8px 18px"><b>Audio attivo</b></button>
  </div>
  <h2>COLONNA SONORA</h2>
  <div class="grid" id="tracks"></div>
  <div class="bar" style="margin-top:14px">
    <label>INTENSITÀ <input id="minten" type="range" min="0" max="100" value="0"></label>
    <label>MUSICA <input id="mvol" type="range" min="0" max="100" value="100"></label>
    <button id="mstop" style="padding:8px 18px"><b>Ferma musica</b></button>
    <div id="minfo" style="font:600 13px var(--f-label);letter-spacing:.14em;color:#d8b888;min-width:300px;text-align:center">— ferma —</div>
  </div>
  <div id="groups"></div>
  <div class="hint">Nel gioco: <b>M</b> disattiva l'audio · l'ambiente e i tamburi partono da soli</div>
</div>
<script type="module">
import { createSound } from './audio-engine.js';
import { createMusic, TRACKS } from './music-engine.js';
const S = window.__lab = createSound();
const G = [
  ['COMBATTIMENTO', [
    ['slash', 'Fendente', 'sibilo d\'aria e lama'], ['hit', 'Colpo a segno', 'impatto sordo sulla carne'], ['crit', 'Colpo critico', 'impatto con scintillio metallico'],
    ['hurt', 'Dante ferito', 'gemito e colpo al petto'], ['die', 'Morte di un dannato', 'urlo che precipita'] ]],
  ['MOSSE', [
    ['fire', 'Fuoco di Virgilio', 'fiammata che sale e crepita'], ['turbine', 'Turbine della Bufera', 'tre sibili in giro'], ['nova', 'Grido del Giudizio', 'boato, onda e campane'],
    ['dash', 'Scatto della Lonza', 'folata veloce'], ['potion', 'Lacrima di Beatrice', 'bollicine e tintinnio'], ['boom', 'Colpo a terra', 'esplosione profonda'] ]],
  ['MONDO', [
    ['gate', 'Cancello che si apre', 'catene, pietra e campane'], ['ok', 'Enigma risolto', 'accordo di campane'], ['bad', 'Enigma sbagliato', 'dissonanza cupa'],
    ['step', 'Passo', 'piede su pietra'], ['heartbeat', 'Battito', 'sotto il 30% di vita'], ['drum', 'Tamburo di battaglia', 'colpo di grancassa'], ['horn', 'Corno di Minosse', 'ingresso del boss'] ]],
  ['TESORI E PROGRESSI', [
    ['loot', 'Oggetto raccolto', 'tintinnio breve'], ['rare', 'Oggetto raro', 'arpeggio scintillante'], ['level', 'Nuovo livello', 'coro di sinusoidi e campane'] ]]
];
const root = document.getElementById('groups');
for (const [name, items] of G) {
  root.insertAdjacentHTML('beforeend', `<h2>${name}</h2><div class="grid">${items.map(([k, t, d]) => `<button data-k="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>`);
}
root.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.init(); S[b.dataset.k](); b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 260); });
const ambB = document.getElementById('amb'), intB = document.getElementById('int'), muteB = document.getElementById('mute');
let inten = 0;
ambB.onclick = () => { S.init(); if (S.amb) { S.stopAmbient(); ambB.firstChild.textContent = 'Ambiente: spento'; } else { S.startAmbient(); ambB.firstChild.textContent = 'Ambiente: acceso'; } };
intB.onclick = () => { S.init(); inten = inten >= 1 ? 0 : inten + 0.5; S.setIntensity(inten); intB.firstChild.textContent = `Tensione: ${Math.round(inten * 100)}%`; };
muteB.onclick = () => { S.init(); S.setMuted(!S.muted); muteB.firstChild.textContent = S.muted ? 'Audio disattivato' : 'Audio attivo'; };
document.getElementById('vol').oninput = e => { S.init(); S.setVolume(e.target.value / 100); };
// oscilloscopio
const cv = document.getElementById('scope'), cx = cv.getContext('2d'), meter = document.getElementById('meter'); let buf;
(function draw() {
  requestAnimationFrame(draw); cx.fillStyle = 'rgba(8,3,3,.35)'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = '#3a2412'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(0, 60); cx.lineTo(1000, 60); cx.stroke();
  if (!S.analyser) return; buf = buf || new Uint8Array(S.analyser.fftSize); S.analyser.getByteTimeDomainData(buf);
  cx.strokeStyle = '#ffb060'; cx.shadowColor = '#ff7a20'; cx.shadowBlur = 8; cx.lineWidth = 2; cx.beginPath();
  for (let i = 0; i < 1000; i++) { const v = buf[Math.floor(i / 1000 * buf.length)] / 128 - 1; const y = 60 + v * 56; i ? cx.lineTo(i, y) : cx.moveTo(i, y); } cx.stroke(); cx.shadowBlur = 0;
  meter.style.width = Math.min(100, S.level01() * 100) + '%';
})();

// ---- colonna sonora ----
const M = window.__labMusic = createMusic(S);
const tr = document.getElementById('tracks');
for (const [k, t] of Object.entries(TRACKS)) tr.insertAdjacentHTML('beforeend', `<button data-t="${k}"><b>${t.label}</b><span>${t.bpm} battiti al minuto${t.perc ? ' · percussioni' : ''}${t.brass ? ' · ottoni' : ''}</span></button>`);
const setOn = k => tr.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === k));
tr.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.init(); const k = b.dataset.t; if (!M.playing) M.start(k); else M.setState(k); setOn(k); });
document.getElementById('minten').oninput = e => M.setIntensity(e.target.value / 100);
document.getElementById('mvol').oninput = e => M.setVolume(e.target.value / 100);
document.getElementById('mstop').onclick = () => { M.stop(); setOn(null); };
setInterval(() => { const i = M.playing ? M.info() : null; document.getElementById('minfo').textContent = i ? `${i.label.toUpperCase()} · ${i.bpm} bpm · ${i.chord} · battuta ${i.bar}` : '— ferma —'; }, 250);
</script>
</body>
</html>
