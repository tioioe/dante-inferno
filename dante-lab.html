<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dante — Laboratorio del modello</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#100607;color:#e8d2b0;font-family:"Palatino Linotype",Georgia,serif}
  canvas{display:block}
  #ui{position:fixed;left:14px;top:12px;display:flex;flex-direction:column;gap:8px;max-width:240px}
  #ui h1{margin:0 0 4px;font-size:17px;letter-spacing:.14em;color:#ffb878;font-weight:normal}
  #ui div{display:flex;flex-wrap:wrap;gap:5px}
  button{font:inherit;font-size:13px;padding:5px 10px;color:#f1dcc0;background:#3a1008;border:1px solid #8a3a1a;cursor:pointer}
  button:hover{background:#6a1c0a}button.on{background:#8a2a10;border-color:#ffb878}
  label{font-size:13px;color:#cfae8a;display:flex;gap:6px;align-items:center}
  #hint{position:fixed;left:14px;bottom:10px;font-size:12px;color:#8a7358}
</style>
</head>
<body>
<div id="ui">
  <h1>DANTE · LABORATORIO</h1>
  <div id="anims"></div>
  <div id="views"></div>
  <label><input type="checkbox" id="turn"> piattaforma girevole</label>
  <label><input type="checkbox" id="move"> corri avanti e indietro (inerzia)</label>
  <label><input type="checkbox" id="armor"> mostra armatura originale</label>
  <label><input type="checkbox" id="sword" checked> spada</label>
</div>
<div id="hint">trascina per ruotare · rotellina per avvicinare</div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/jsm/loaders/GLTFLoader.js';
import * as SkeletonUtils from './lib/jsm/utils/SkeletonUtils.js';
import { dressDante } from './dante.js';
const V3 = THREE.Vector3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x120708);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 80);

// luci come nel gioco: calda frontale, fredda di controluce, fiaccola arancione
scene.add(new THREE.HemisphereLight(0xb8a39a, 0x16100f, 0.9));
const key = new THREE.DirectionalLight(0xffd8bc, 2.0); key.position.set(2.5, 4, 3.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 }); key.shadow.bias = -0.0005; scene.add(key);
const rim = new THREE.DirectionalLight(0x5a78ff, 0.9); rim.position.set(-3, 2.5, -3); scene.add(rim);
const torch = new THREE.PointLight(0xff7a30, 14, 7, 2); torch.position.set(0.9, 1.6, 1.2); scene.add(torch);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.6, 48), new THREE.MeshStandardMaterial({ color: 0x2c2321, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ringM = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.23, 64), new THREE.MeshBasicMaterial({ color: 0xff5a20, side: THREE.DoubleSide }));
ringM.rotation.x = -Math.PI / 2; ringM.position.y = 0.005; scene.add(ringM);
// freccia verso +z: dove "guarda" Dante nel gioco
const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.16, 8), new THREE.MeshBasicMaterial({ color: 0x4aff88 }));
arrow.rotation.x = Math.PI / 2; arrow.position.set(0, 0.03, 1.5); scene.add(arrow);

const turn = new THREE.Group(); scene.add(turn);
const gltf = await new GLTFLoader().loadAsync('./assets/dante.glb');
gltf.scene.updateMatrixWorld(true); gltf.scene.traverse(o => { if (o.isSkinnedMesh) o.skeleton.update(); });
const box = new THREE.Box3().setFromObject(gltf.scene, true), H = box.max.y - box.min.y, minY = box.min.y;
const root = new THREE.Group(), model = SkeletonUtils.clone(gltf.scene), s = 1.8 / H;
model.scale.setScalar(s); model.position.y = -minY * s; root.add(model); turn.add(root);
const mixer = new THREE.AnimationMixer(model), act = {};
gltf.animations.forEach(c => act[c.name] = mixer.clipAction(c));
const actor = { root, model, mixer, act };
const info = dressDante(actor);
// la spada del gioco (stessa forma), per vedere l'insieme
const sword = new THREE.Group();
{
  const fm = new THREE.MeshStandardMaterial({ color: 0xffb060, emissive: 0xff5a10, emissiveIntensity: 3.2, metalness: 0.6, roughness: 0.3 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.04, 1.5), fm); b.position.z = 0.95;
  const gd = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.08, 0.1), new THREE.MeshStandardMaterial({ color: 0x8a5a20, metalness: 0.8, roughness: 0.4 })); gd.position.z = 0.2;
  const gr = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0x2a1408 })); gr.rotation.x = Math.PI / 2; gr.position.z = 0.03;
  sword.add(b, gd, gr); sword.position.set(0.38, 1.05, 0.25); sword.rotation.set(1.05, 0.25, 0.1); root.add(sword);
}

let cur = null;
function play(name) {
  document.querySelectorAll('#anims button').forEach(b => b.classList.toggle('on', b.dataset.a === name));
  mixer.stopAllAction();
  if (name === 'Pose T') { model.traverse(o => { if (o.isSkinnedMesh) o.skeleton.pose(); }); cur = null; return; }
  const a = act[name]; if (a) { a.reset().play(); cur = name; }
}
['Idle', 'Walk', 'Run', 'Pose T'].forEach(n => { const b = document.createElement('button'); b.textContent = n; b.dataset.a = n; b.onclick = () => play(n); $('anims').appendChild(b); });
function $(id) { return document.getElementById(id); }

// telecamera orbitale
const st = { yaw: 0.5, pitch: 0.12, dist: 5.2, tgt: new V3(0, 0.95, 0) };
const VIEWS = {
  'Intero': { yaw: 0.55, pitch: 0.12, dist: 5.2, tgt: [0, 0.92, 0] },
  'Fronte': { yaw: 0, pitch: 0.05, dist: 5.2, tgt: [0, 0.92, 0] },
  'Retro': { yaw: Math.PI, pitch: 0.08, dist: 5.2, tgt: [0, 0.92, 0] },
  'Lato': { yaw: Math.PI / 2, pitch: 0.05, dist: 5.2, tgt: [0, 0.92, 0] },
  'Volto': { yaw: 0.35, pitch: 0.05, dist: 1.1, tgt: [0, 1.66, 0] },
  'Profilo': { yaw: Math.PI / 2, pitch: 0.03, dist: 1.1, tgt: [0, 1.66, 0] },
  'Busto': { yaw: 0.4, pitch: 0.1, dist: 2.2, tgt: [0, 1.35, 0] },
  'Gioco': { yaw: Math.PI * 0.75, pitch: 0.95, dist: 14, tgt: [0, 0.6, 0], fov: 34 }       // come la camera isometrica del gioco
};
function view(name) {
  const v = VIEWS[name]; Object.assign(st, { yaw: v.yaw, pitch: v.pitch, dist: v.dist }); st.tgt.set(...v.tgt);
  camera.fov = v.fov || 30; camera.updateProjectionMatrix();
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === name));
}
Object.keys(VIEWS).forEach(n => { const b = document.createElement('button'); b.textContent = n; b.dataset.v = n; b.onclick = () => view(n); $('views').appendChild(b); });
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; st.yaw -= (e.clientX - drag[0]) * 0.008; st.pitch = Math.max(-0.2, Math.min(1.4, st.pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { st.dist = Math.max(0.5, Math.min(12, st.dist * (1 + e.deltaY * 0.001))); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
$('armor').onchange = e => { model.traverse(o => { if (o.isSkinnedMesh) o.visible = e.target.checked; }); };
$('sword').onchange = e => { sword.visible = e.target.checked; };
play('Idle'); view('Intero');

const clock = new THREE.Clock(); let mt = 0;
window.__lab = { view, play, st, camera, root, model, info, actor, THREE };
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  mixer.update(dt);
  if ($('turn').checked) turn.rotation.y += dt * 0.5;
  mt += dt; root.position.z = $('move').checked ? Math.sin(mt * 3.2) * 1.5 : 0;           // ~4,8 m/s al massimo, come una corsa del gioco
  camera.position.set(st.tgt.x + Math.sin(st.yaw) * Math.cos(st.pitch) * st.dist, st.tgt.y + Math.sin(st.pitch) * st.dist, st.tgt.z + Math.cos(st.yaw) * Math.cos(st.pitch) * st.dist);
  camera.lookAt(st.tgt);
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
