<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dante — Inferno</title>
<meta name="description" content="Dante — Inferno: un gioco d'azione isometrico ispirato alla Divina Commedia. Scendi nei cerchi, affronta Minosse e Cerbero. Si gioca nel browser, con tastiera e mouse.">
<meta property="og:title" content="Dante — Inferno"><meta property="og:description" content="Un gioco d'azione nel browser ispirato alla Divina Commedia.">
<style>
  :root{--stone:#1a1110}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0203;color:#e8d2b0;font-family:"Palatino Linotype",Georgia,serif;user-select:none}
  canvas#gl{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  #zone{position:absolute;left:20px;top:16px;max-width:340px;text-shadow:0 0 6px #000}
  #zone b{display:block;font-size:19px;letter-spacing:.1em;color:#ffb878}
  #zone span{display:block;font-size:14px;color:#cfae8a;margin-top:3px}
  #obj{margin-top:10px;font-size:15px;color:#f3e0b8}
  #obj:before{content:"◆ ";color:#e0602a}
  #mini{position:absolute;right:14px;top:10px;width:214px;height:214px}
  #mini canvas{position:absolute;left:12px;top:12px;width:190px;height:190px;border-radius:50%}
  #mini img{position:absolute;left:0;top:0;width:214px;height:214px;filter:drop-shadow(0 0 8px #000)}
  #boss{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:520px;text-align:center;display:none}
  #boss div{font-size:19px;letter-spacing:.14em;color:#ffcf9a;text-shadow:0 0 8px #000;margin-bottom:4px}
  #bossbar{height:16px;border:2px solid #3a4a3a;background:var(--stone) center/cover;box-shadow:inset 0 0 8px #000,0 0 10px #000}
  #bossfill{display:block;height:100%;width:100%;background:linear-gradient(#e03030,#6a0808);box-shadow:0 0 10px #c02020}
  #msg{position:absolute;left:50%;top:15%;transform:translateX(-50%);max-width:66%;text-align:center;font-size:22px;font-style:italic;text-shadow:0 0 10px #000,0 0 22px #a0300a;opacity:0;transition:opacity .5s}
  #banner{position:absolute;left:50%;top:36%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 1s;text-shadow:0 0 18px #000,0 0 30px #a0300a}
  #banner b{display:block;font-size:46px;letter-spacing:.2em;color:#ffcf9a;font-weight:normal}
  #banner span{font-size:18px;letter-spacing:.3em;color:#d8a070}
  #toasts{position:absolute;left:20px;bottom:190px;width:340px}
  .toast{margin-top:6px;padding:7px 10px;background:#0c0505cc;border-left:4px solid #888;font-size:14px;line-height:1.35;text-shadow:0 0 4px #000;transition:opacity .8s}
  .toast small{display:block;color:#bfa27c;font-size:12px}
  #bottom{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px}
  .orbwrap{position:relative;width:158px;height:158px;flex:none}
  .orbwrap img{position:absolute;inset:0;width:158px;height:158px;filter:drop-shadow(0 0 10px #000)}
  .orb{position:absolute;left:11px;top:11px;width:136px;height:136px;border-radius:50%;overflow:hidden;background:#0c0505;box-shadow:inset 0 0 26px #000}
  .orb .fill{position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .12s}
  .orb .fill:before{content:"";position:absolute;left:0;right:0;top:-6px;height:10px;background:inherit;filter:brightness(1.5) blur(2px);opacity:.8}
  .orb.hp .fill{background:radial-gradient(circle at 38% 28%,#ff8a68,#c01818 52%,#4a0606)}
  .orb.res .fill{background:radial-gradient(circle at 38% 28%,#a8d0ff,#2a60d8 52%,#0e2064)}
  .orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 24%,#ffffff55,transparent 38%),radial-gradient(circle,transparent 58%,#000a 100%)}
  .orb span{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-size:17px;text-shadow:0 0 5px #000,0 0 2px #000;color:#fff}
  #center{display:flex;flex-direction:column;gap:7px;align-items:center;padding-bottom:12px}
  #skills{display:flex;gap:7px;padding:8px 10px;background:var(--stone) center/cover;border:2px solid #0a0f0a;box-shadow:inset 0 0 0 2px #3a4a3a,inset 0 0 16px #000,0 0 14px #000}
  .slot{position:relative;width:58px;height:58px;background:#0c0808 center/cover;box-shadow:inset 0 0 0 2px #0a0f0a,inset 0 0 0 3px #4a5a4a,inset 0 0 12px #000;text-align:center;overflow:hidden}
  .slot svg{width:34px;height:34px;margin-top:6px;filter:drop-shadow(0 0 4px #000)}
  .slot b{position:absolute;left:0;right:0;bottom:2px;font-size:10px;color:#e0b888;letter-spacing:.08em;text-shadow:0 0 3px #000}
  .slot i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#000c}
  .slot.nofede{box-shadow:inset 0 0 0 2px #0a0f0a,inset 0 0 0 3px #3a60c0,inset 0 0 12px #000}
  .slot .cnt{position:absolute;right:4px;top:2px;font-size:13px;color:#fff;text-shadow:0 0 3px #000}
  #xpwrap{position:relative;width:500px;height:10px;border:2px solid #0a0f0a;background:var(--stone) center/cover;box-shadow:inset 0 0 0 1px #3a4a3a,0 0 10px #000}
  #xp{height:100%;width:0;background:linear-gradient(#f0c060,#9a6010);box-shadow:0 0 8px #e8a030}
  #lvl{position:absolute;right:-52px;top:-6px;font-size:16px;color:#ffcf9a;text-shadow:0 0 4px #000}
  #dmg,#bars{position:absolute;inset:0;overflow:hidden}
  .dn{position:absolute;font-weight:bold;font-size:17px;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;white-space:nowrap}
  .dn.crit{color:#ffd23a;font-size:26px}.dn.hurt{color:#ff5a4a}.dn.heal{color:#6aff8a}.dn.xp{color:#c8a0ff;font-size:15px}
  .eb{position:absolute;width:54px;height:6px;margin-left:-27px;border:1px solid #000;background:#2a0808;display:none}
  .eb i{display:block;height:100%;width:100%;background:#d22}
  .eb.elite{width:90px;margin-left:-45px;height:8px}.eb.elite i{background:#e8a020}
  #inv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;padding:16px 20px;background:var(--stone) center/cover;border:2px solid #0a0f0a;box-shadow:inset 0 0 0 2px #3a4a3a,0 0 30px #000;display:none;line-height:1.5}
  #inv h3{margin:0 0 8px;color:#ffb878;letter-spacing:.12em;font-weight:normal;font-size:20px}
  #inv p{margin:6px 0;font-size:15px}
  #flash{position:fixed;inset:0;pointer-events:none}
  #hud{transition:opacity 1.6s}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0}
  #verse{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);width:min(920px,86vw);text-align:center;opacity:0;transition:opacity 1.3s;text-shadow:0 0 14px #000,0 0 32px #000;pointer-events:none;padding:28px 36px;background:radial-gradient(ellipse at center,rgba(0,0,0,.78),rgba(0,0,0,.45) 55%,rgba(0,0,0,0) 78%)}
  #verse b{display:block;font-weight:normal;font-style:italic;font-size:30px;line-height:1.55;color:#ffd9a0;letter-spacing:.03em}
  #verse span{display:block;margin-top:14px;font-size:17px;color:#c9ad8a;line-height:1.5}
  #canto{position:fixed;left:50%;top:9%;transform:translateX(-50%);font-size:15px;letter-spacing:.5em;color:#a88a66;opacity:0;transition:opacity 1.6s;text-shadow:0 0 10px #000;pointer-events:none}
  #skip{position:fixed;right:22px;bottom:18px;font-size:13px;letter-spacing:.15em;color:#8a7358;display:none;pointer-events:none}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#2a0808cc,#050101f2);text-align:center}
  #title h1{font-size:68px;margin:0;letter-spacing:.2em;color:#ffb06a;text-shadow:0 0 30px #ff4a10}
  #title h2{font-weight:normal;font-style:italic;margin:6px 0 26px;color:#d8a070}
  #title p{margin:4px;font-size:16px;color:#cfae8a}
  button{margin-top:26px;padding:14px 42px;font:inherit;font-size:21px;letter-spacing:.15em;color:#fff1d8;background:#6a1608;border:2px solid #ff7a3a;cursor:pointer}
  button:hover{background:#9a2208}
</style>
